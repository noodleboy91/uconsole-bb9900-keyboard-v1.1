# GitHub Actions build matrix. Every artifact here targets V1.1 hardware.
---
include:
  # Trackpad left click, B tap middle click.
  - board: bb9900
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DBB9900_V1_1
    artifact-name: bb9900-v1.1-zmk
  # Trackpad middle click, B tap left click.
  - board: bb9900
    cmake-args: -DDTS_EXTRA_CPPFLAGS="-DBB9900_V1_1;-DMIDDLE_CLICK_TRACKPAD"
    artifact-name: bb9900-v1.1-zmk-middle-click
  # One-handed layout: mouse buttons and a scroll switch on the face buttons.
  - board: bb9900
    cmake-args: -DDTS_EXTRA_CPPFLAGS="-DBB9900_V1_1;-DONE_HANDED"
    artifact-name: bb9900-v1.1-zmk-one-handed
